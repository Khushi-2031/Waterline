<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waterline</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Waterline">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#062e2b">
<style>
  :root{
    --abyss:#04211f;
    --ink:#062e2b;
    --deep:#005957;
    --tide:#0d8b81;
    --foam:#7fe3d2;
    --sand:#ece5d6;
    --mute:#7b968f;
    --amber:#f2a65a;
    --line:rgba(236,229,214,.12);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--abyss);color:var(--sand);font-family:var(--sans);
    font-size:16px;line-height:1.45;padding-bottom:120px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 18px}

  /* ---------- header / tide ---------- */
  header{position:relative;overflow:hidden;background:var(--ink);border-bottom:1px solid var(--line)}
  #tide{position:absolute;left:0;right:0;bottom:0;height:0%;
    background:linear-gradient(180deg,var(--deep),#00403f);
    transition:height .7s cubic-bezier(.4,0,.2,1)}
  #tide svg{position:absolute;top:-13px;left:0;width:200%;height:14px;display:block;
    animation:drift 9s linear infinite}
  @keyframes drift{to{transform:translateX(-50%)}}
  .hd{position:relative;z-index:2;padding:26px 0 22px}
  .brand{display:flex;align-items:baseline;justify-content:space-between}
  h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.045em;text-transform:uppercase}
  h1 em{font-style:normal;color:var(--foam)}
  .streak{font-family:var(--mono);font-size:11px;color:var(--foam);
    border:1px solid rgba(127,227,210,.35);border-radius:99px;padding:4px 9px;white-space:nowrap}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
  .today{margin-top:16px}
  .today .name{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
  .today .sub{font-size:13px;color:var(--mute);margin-top:3px}
  .meter{display:flex;gap:14px;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--mute)}
  .meter b{color:var(--sand);font-weight:600}

  /* ---------- day rail ---------- */
  .rail{display:flex;gap:7px;overflow-x:auto;padding:12px 18px;scrollbar-width:none;
    background:var(--ink);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .rail::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--mute);
    border-radius:99px;padding:7px 13px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;cursor:pointer}
  .pill.on{background:var(--foam);color:#04211f;border-color:var(--foam);font-weight:600}
  .pill.rec{border-style:dashed}

  /* ---------- tabs ---------- */
  nav{display:flex;gap:24px;padding:16px 0 0}
  nav button{background:none;border:0;padding:0 0 10px;color:var(--mute);cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    border-bottom:2px solid transparent}
  nav button.on{color:var(--sand);border-bottom-color:var(--foam)}

  /* ---------- blocks ---------- */
  .block{margin-top:26px}
  .block-hd{display:flex;align-items:baseline;justify-content:space-between;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .block-hd h2{margin:0;font-size:12px;font-family:var(--mono);letter-spacing:.18em;
    text-transform:uppercase;font-weight:600}
  .block-hd span{font-family:var(--mono);font-size:11px;color:var(--mute)}

  .ex{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
  .ex .idx{font-family:var(--mono);font-size:11px;color:var(--mute);padding-top:3px;min-width:20px}
  .ex .body{flex:1;min-width:0}
  .ex .nm{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
  .ex.done .nm{color:var(--mute)}
  .gear{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--foam);
    border:1px solid rgba(127,227,210,.28);border-radius:3px;padding:2px 6px}
  .yt{display:inline-block;margin-left:7px;font-family:var(--mono);font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-decoration:none;
    border-bottom:1px solid var(--line);padding-bottom:1px}
  .yt:hover,.yt:focus-visible{color:var(--foam);border-bottom-color:var(--foam)}
  .prescribe{font-family:var(--mono);font-size:12px;color:var(--mute);margin-top:8px}
  .prescribe b{color:var(--sand);font-weight:600}
  .note{font-size:12.5px;color:var(--mute);margin-top:6px;font-style:italic}

  .row{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
  .dots{display:flex;gap:6px}
  .dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
    background:transparent;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--mute)}
  .dot.on{background:var(--tide);border-color:var(--tide);color:#04211f;font-weight:700}
  .wt{width:78px;background:transparent;border:1px solid var(--line);border-radius:8px;
    color:var(--sand);font-family:var(--mono);font-size:12px;padding:7px 8px}
  .wt::placeholder{color:var(--mute)}
  .wt:focus,.dot:focus-visible,.pill:focus-visible,nav button:focus-visible{
    outline:2px solid var(--foam);outline-offset:2px}

  /* ---------- form picture ---------- */
  .formBtn{display:inline-block;margin-left:7px;font-family:var(--mono);font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--mute);background:none;
    border:0;border-bottom:1px solid var(--line);padding:0 0 1px;cursor:pointer}
  .formBtn:hover,.formBtn:focus-visible,.formBtn.on{color:var(--foam);border-bottom-color:var(--foam)}
  .formPanel{display:none;gap:14px;align-items:center;margin-top:10px;padding:12px;
    border:1px solid var(--line);border-radius:10px;background:rgba(127,227,210,.05)}
  .formPanel.show{display:flex}
  .fig{width:58px;height:64px;flex:0 0 auto;color:var(--foam)}
  .fig .hd{fill:currentColor}
  .fig .im{fill:currentColor;opacity:.3}
  .fig path,.fig line:not(.grd){stroke:currentColor;stroke-width:5;stroke-linecap:round;
    stroke-linejoin:round;fill:none}
  .fig line.grd{stroke:var(--line);stroke-width:2}
  .formPanel .cue{font-size:12.5px;color:var(--sand);line-height:1.5}

  /* ---------- body weight ---------- */
  .bw{display:flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--mono);
    font-size:11px;color:var(--mute);flex-wrap:wrap}
  .bw input{width:72px;background:transparent;border:1px solid var(--line);border-radius:8px;
    color:var(--sand);font-family:var(--mono);font-size:12px;padding:6px 8px}
  .bw input::placeholder{color:var(--mute)}
  .bw input:focus{outline:2px solid var(--foam);outline-offset:2px}
  .bw span{color:var(--foam)}

  /* ---------- this week strip ---------- */
  .wk{display:flex;align-items:center;gap:10px;margin-top:12px;font-family:var(--mono);
    font-size:11px;color:var(--mute)}
  .wkdots{display:flex;gap:6px}
  .wdot{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:transparent;
    color:var(--mute);font-family:var(--mono);font-size:11px;cursor:pointer;padding:0}
  .wdot.on{background:var(--tide);border-color:var(--tide);color:#04211f;font-weight:700}
  .wdot.missed{border-color:var(--amber);border-style:dashed;color:var(--amber)}
  .wdot.future{opacity:.35;cursor:default}
  .wdot.today{box-shadow:0 0 0 1px var(--foam)}
  .wdot:focus-visible{outline:2px solid var(--foam);outline-offset:2px}

  /* ---------- gear tab ---------- */
  .gsec{margin-top:24px}
  .gsec h3{margin:0 0 10px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--foam)}
  .gitem{display:flex;justify-content:space-between;gap:14px;padding:11px 0;
    border-bottom:1px solid var(--line);font-size:14.5px}
  .gitem span{font-family:var(--mono);font-size:11px;color:var(--mute);text-align:right;flex:0 0 42%}

  /* ---------- week tab ---------- */
  .wcard{border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:11px;cursor:pointer}
  .wcard .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .wcard .nm{font-size:17px;font-weight:700;letter-spacing:-.02em}
  .wcard .dy{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--foam);text-transform:uppercase}
  .wcard .sub{font-size:13px;color:var(--mute);margin-top:4px}

  .callout{border-left:2px solid var(--amber);padding:12px 0 12px 14px;margin-top:26px;
    font-size:13.5px;color:var(--mute)}
  .callout b{color:var(--amber);font-family:var(--mono);font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;display:block;margin-bottom:6px}

  /* ---------- rest timer ---------- */
  #rest{position:fixed;left:0;right:0;bottom:0;background:var(--ink);
    border-top:1px solid var(--foam);transform:translateY(110%);transition:transform .3s;z-index:40}
  #rest.up{transform:none}
  .rin{max-width:640px;margin:0 auto;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:14px}
  #rclock{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--foam)}
  .rlbl{flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--mute)}
  #rest button{background:transparent;border:1px solid var(--line);color:var(--sand);
    border-radius:99px;padding:8px 14px;font-family:var(--mono);font-size:11px;
    text-transform:uppercase;letter-spacing:.1em;cursor:pointer}

  .foot{margin:36px 0 10px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--mute);text-align:center}
  .tiny{background:none;border:1px solid var(--line);border-radius:99px;color:var(--mute);
    font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
    padding:5px 11px;margin:10px 4px 0;cursor:pointer}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<header>
  <div id="tide">
    <svg viewBox="0 0 1200 14" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 8 Q 75 0 150 8 T 300 8 T 450 8 T 600 8 T 750 8 T 900 8 T 1050 8 T 1200 8 V14 H0Z" fill="#005957"/>
    </svg>
  </div>
  <div class="hd wrap">
    <div class="brand">
      <h1>Water<em>line</em></h1>
      <div class="streak" id="streak">— day streak</div>
    </div>
    <div class="today">
      <div class="eyebrow" id="dayTag">Day 1</div>
      <div class="name" id="dayName">—</div>
      <div class="sub" id="daySub">—</div>
    </div>
    <div class="meter">
      <div><b id="mSets">0/0</b> sets</div>
      <div><b id="mMins">—</b> min</div>
      <div><b id="mPct">0%</b> done</div>
    </div>
    <div class="bw">
      <label for="bwInput">Body weight</label>
      <input id="bwInput" type="text" inputmode="decimal" placeholder="kg today" aria-label="Log today's body weight in kg">
      <span id="bwTrend"></span>
    </div>
    <div class="wk">
      <label>This week</label>
      <div class="wkdots" id="wkStrip"></div>
    </div>
  </div>
</header>

<div class="rail" id="rail"></div>

<div class="wrap">
  <nav>
    <button data-tab="today" class="on">Today</button>
    <button data-tab="week">Week</button>
    <button data-tab="gear">Gear</button>
  </nav>
  <main id="view"></main>
  <div class="foot">
    Bodyweight in, reps up. That's the whole log.<br>
    <button id="bExp" class="tiny">Back up</button>
    <button id="bImp" class="tiny">Restore</button>
  </div>
</div>

<div id="rest">
  <div class="rin">
    <div id="rclock">0:00</div>
    <div class="rlbl">Rest</div>
    <button id="rAdd">+30s</button>
    <button id="rSkip">Skip</button>
  </div>
</div>

<script>
/* ============================================================
   EQUIPMENT — read off the college gym photos
   ============================================================ */
const GEAR = [
  ["Free weights", [
    ["Olympic barbells + plates", "squat rack & bench"],
    ["Hex dumbbells", "full rack, light → heavy"],
    ["Kettlebell", "swings, goblet work"],
    ["Flat / incline / decline benches", "press + hip thrust"],
    ["Squat rack", "squats, RDL, hip thrust"],
    ["Step platforms", "step-ups, calf raises"]
  ]],
  ["Cables & selectorised", [
    ["Dual-column functional trainer", "crossovers, kickbacks, face pulls"],
    ["High pulley + rope / bar", "pulldowns, pushdowns, crunches"],
    ["Seated row station", "mid-back"],
    ["SportsArt chest press", "machine pressing"],
    ["SportsArt leg extension / leg curl", "quad + hamstring isolation"],
    ["Seated leg press", "main quad + glute driver"],
    ["Plate-loaded chest / incline press", "heavy pressing, safe alone"],
    ["Assisted pull-up & dip machine", "your pull-up progression"],
    ["Captain's chair", "hanging knee raises"],
    ["Wall pull-up bar", "dead hangs, scap pulls"],
    ["Suspension straps (TRX-style)", "rows, core"]
  ]],
  ["Cardio & recovery", [
    ["Treadmills", "incline walks, warm-ups"],
    ["Cross trainer / elliptical", "low-impact cardio"],
    ["Upright bike + spin bike", "warm-up, zone 2"],
    ["Foam roller", "post-session"],
    ["Skipping rope", "conditioning finishers"]
  ]]
];

/* ============================================================
   FORM PICTURES — minimalist correct-position diagrams,
   grouped by movement pattern so the same picture covers every
   exercise that shares that position. Shown inline, in-app.
   ============================================================ */
const FORMS = {
  squat:{cue:"Chest tall, hips back and down, knees track over the toes.",
    svg:'<svg viewBox="0 0 100 110" class="fig"><circle class="hd" cx="52" cy="18" r="8"/><path d="M52 26 L49 54 M49 54 L34 70 L38 100 M49 54 L64 70 L60 100 M52 30 L74 40"/><line class="grd" x1="8" y1="102" x2="92" y2="102"/></svg>'},
  hinge:{cue:"Soft knees, push the hips back, flat back, bar stays close to the legs.",
    svg:'<svg viewBox="0 0 100 110" class="fig"><circle class="hd" cx="54" cy="16" r="8"/><path d="M54 24 L40 50 M40 50 L37 78 L36 100 M40 50 L44 78 L45 100 M54 28 L50 64"/><line x1="40" y1="64" x2="62" y2="64"/><line class="grd" x1="8" y1="102" x2="92" y2="102"/></svg>'},
  bridge:{cue:"Chin tucked, drive through the heels, pause and squeeze at the top.",
    svg:'<svg viewBox="0 0 100 110" class="fig"><circle class="hd" cx="14" cy="76" r="8"/><path d="M20 78 L52 66 M52 66 L68 88 M68 88 L80 98"/><rect class="im" x="2" y="82" width="16" height="6"/><line class="grd" x1="8" y1="102" x2="92" y2="102"/></svg>'},
  lunge:{cue:"Front knee stacks over the ankle, torso stays upright, step under control.",
    svg:'<svg viewBox="0 0 100 110" class="fig"><circle class="hd" cx="50" cy="16" r="8"/><path d="M50 24 L50 52 M50 52 L66 64 L64 100 M50 52 L32 70 L26 100 M50 28 L38 20 M50 28 L64 36"/><line class="grd" x1="8" y1="102" x2="92" y2="102"/></svg>'},
  pressH:{cue:"Shoulder blades pinned, feet planted, bar path stays straight over the chest.",
    svg:'<svg viewBox="0 0 100 110" class="fig"><circle class="hd" cx="16" cy="58" r="8"/><path d="M24 58 L60 58 M60 58 L68 78 L64 100 M36 58 L36 22"/><line x1="26" y1="22" x2="46" y2="22"/><line class="grd" x1="6" y1="66" x2="72" y2="66"/></svg>'},
  pressV:{cue:"Ribs down, core braced, press straight overhead — not out in front.",
    svg:'<svg viewBox="0 0 100 110" class="fig"><circle class="hd" cx="50" cy="16" r="8"/><path d="M50 24 L50 58 M50 58 L46 100 M50 58 L54 100 M50 28 L66 10 M50 28 L34 10"/><line x1="34" y1="10" x2="66" y2="10"/><line class="grd" x1="8" y1="102" x2="92" y2="102"/></svg>'},
  pullV:{cue:"Pull with the elbows, not the hands. Chest up, lead down to the collarbone.",
    svg:'<svg viewBox="0 0 100 110" class="fig"><circle class="hd" cx="50" cy="16" r="8"/><path d="M50 24 L50 56 M50 56 L40 76 L40 100 M50 56 L60 76 L60 100 M50 28 L70 18 L56 40 M50 28 L30 18 L44 40"/><line x1="30" y1="18" x2="70" y2="18"/><line class="grd" x1="8" y1="102" x2="92" y2="102"/></svg>'},
  pullH:{cue:"Flat back, ribs down, drive the elbow back past the torso.",
    svg:'<svg viewBox="0 0 100 110" class="fig"><circle class="hd" cx="56" cy="18" r="8"/><path d="M56 25 L42 52 M42 52 L39 100 M56 30 L70 38 L60 54 M60 54 L78 60"/><line class="grd" x1="8" y1="102" x2="92" y2="102"/></svg>'},
  curl:{cue:"Elbow pinned to your side, curl slow, no swinging the torso.",
    svg:'<svg viewBox="0 0 100 110" class="fig"><circle class="hd" cx="50" cy="16" r="8"/><path d="M50 24 L50 58 M50 58 L46 100 M50 58 L54 100 M50 28 L60 50 L52 32"/><line class="grd" x1="8" y1="102" x2="92" y2="102"/></svg>'},
  triceps:{cue:"Elbow stays high and still, only the forearm moves.",
    svg:'<svg viewBox="0 0 100 110" class="fig"><circle class="hd" cx="50" cy="16" r="8"/><path d="M50 24 L48 58 M48 58 L44 100 M48 58 L52 100 M50 28 L58 34 L58 56"/><line class="grd" x1="8" y1="102" x2="92" y2="102"/></svg>'},
  legIso:{cue:"Controlled tempo, no locking out hard at the top.",
    svg:'<svg viewBox="0 0 100 110" class="fig"><circle class="hd" cx="28" cy="18" r="8"/><path d="M28 26 L30 60 M30 60 L60 60 L78 45"/><rect class="im" x="76" y="28" width="6" height="32"/><line class="grd" x1="8" y1="66" x2="92" y2="66"/></svg>'},
  core:{cue:"Ribs pulled down, glutes squeezed, no arch in the lower back.",
    svg:'<svg viewBox="0 0 100 110" class="fig"><circle class="hd" cx="15" cy="55" r="7"/><path d="M21 55 L75 70 M21 55 L21 76 M75 70 L90 70"/><line class="grd" x1="6" y1="80" x2="94" y2="80"/></svg>'},
  raise:{cue:"Light weight, elbows lead the movement, no swinging or shrugging.",
    svg:'<svg viewBox="0 0 100 110" class="fig"><circle class="hd" cx="50" cy="16" r="8"/><path d="M50 24 L50 58 M50 58 L46 100 M50 58 L54 100 M50 28 L78 26 M50 28 L22 26"/><line class="grd" x1="8" y1="102" x2="92" y2="102"/></svg>'},
  swing:{cue:"Power comes from the hip snap, not the arms or the low back.",
    svg:'<svg viewBox="0 0 100 110" class="fig"><circle class="hd" cx="52" cy="18" r="8"/><path d="M52 26 L42 52 M42 52 L36 80 L38 100 M42 52 L50 80 L52 100 M52 30 L70 55"/><circle class="im" cx="74" cy="58" r="5"/><line class="grd" x1="8" y1="102" x2="92" y2="102"/></svg>'},
  calf:{cue:"Full stretch at the bottom, pause at the top of every rep.",
    svg:'<svg viewBox="0 0 100 110" class="fig"><circle class="hd" cx="50" cy="14" r="8"/><path d="M50 22 L50 55 M50 55 L47 95 M50 55 L53 95"/><line x1="44" y1="100" x2="52" y2="104"/><line x1="54" y1="100" x2="62" y2="104"/><line class="grd" x1="8" y1="102" x2="92" y2="102"/></svg>'}
};

/* ============================================================
   THE PLAN — 5 strict training days (Mon/Tue/Wed/Fri/Sat),
   Thursday and Sunday fully off. Built for the goal stated:
   lose fat, flatten the stomach and arms, shape the glutes,
   without adding muscle bulk. That means higher rep ranges
   (12–20), lighter loads than a strength program, short rest
   to keep the session metabolic, and cardio in every session —
   not a heavy/low-rep hypertrophy split. Weight logging stays
   optional on 1–2 main lifts; bodyweight is the log that matters.
   ============================================================ */
const P = (n,g,s,r,rest,note,w,form)=>({n,g,s,r,rest:rest||0,note:note||"",w:!!w,form:form||null});

const PLAN = [
{id:"d1",dow:1,tag:"Day 1 · Monday",name:"Glutes & Legs",sub:"Shape · light-moderate weight, high reps",mins:"50–55",blocks:[
  {label:"Warm-up",mins:5,items:[
    P("Incline treadmill walk","Treadmill",1,"4 min"),
    P("Glute bridges + leg swings","Floor",2,"15 reps")]},
  {label:"Main work",mins:35,items:[
    P("Goblet squat","Kettlebell / dumbbell",3,"15",45,"Light weight. This is a shaping rep range, not a max-effort one.",1,"squat"),
    P("Barbell hip thrust","Barbell + flat bench",3,"15",60,"Chin tucked, squeeze hard at the top — this is the main glute builder.",1,"bridge"),
    P("Dumbbell reverse lunge","Dumbbells",3,"12 / leg",45,"",0,"lunge"),
    P("Cable glute kickback","Functional trainer",3,"15 / side",30,"",0,"hinge"),
    P("Seated leg press — feet high & wide","Leg press",2,"15",45,"Glute-biased foot placement.",0,"legIso")]},
  {label:"Core + cardio finish",mins:12,items:[
    P("Hanging knee raise","Captain's chair",2,"15",30,"",0,"core"),
    P("Incline walk, fat-burn pace","Treadmill",1,"8 min")]}
]},

{id:"d2",dow:2,tag:"Day 2 · Tuesday",name:"Upper Tone + Core",sub:"Light weight, high reps — no bulk work",mins:"45–50",blocks:[
  {label:"Warm-up",mins:5,items:[
    P("Cross trainer, easy","Elliptical",1,"4 min"),

/* ============================================================
   STATE
   ============================================================ */
const KEY = "waterline:v1";
const OLD_KEY = "glowup:v2";
let S = {weights:{}, history:{}, bodyweight:{}, missed:{}, since:null};
let sel = PLAN.find(d=>d.dow===new Date().getDay())||PLAN[0];
let tab = "today";
/* Local-date keys (not UTC) so a late-evening session doesn't log under tomorrow. */
const dateKey = (d)=> d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayKey = ()=> dateKey(new Date());
const exKey = (d,b,i)=> d.id+"-"+b+"-"+i;

/* Works in two places: inside Claude (window.storage) and hosted on the
   open web (localStorage). Picks whichever is available. */
const STORE = {
  async get(k){
    if(window.storage){ try{ const r = await window.storage.get(k); return r? r.value : null; }catch(e){ return null; } }
    try{ return localStorage.getItem(k); }catch(e){ return null; }
  },
  async set(k,v){
    if(window.storage){ try{ await window.storage.set(k,v); return true; }catch(e){} }
    try{ localStorage.setItem(k,v); return true; }catch(e){ return false; }
  }
};
async function load(){
  let raw = await STORE.get(KEY);
  if(!raw) raw = await STORE.get(OLD_KEY);  /* carry over the old GlowUp log */
  if(raw){ try{ S = JSON.parse(raw); }catch(e){} }
  if(!S.bodyweight) S.bodyweight = {};
  if(!S.missed) S.missed = {};
  if(!S.since){ S.since = todayKey(); save(); }
  render();
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(()=>STORE.set(KEY, JSON.stringify(S)),400);
}

/* Back up / restore, so clearing your browser doesn't wipe the log */
function exportData(){
  const blob = new Blob([JSON.stringify(S)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "waterline-backup-"+todayKey()+".json";
  a.click(); URL.revokeObjectURL(a.href);
}
function importData(){
  const f = document.createElement("input");
  f.type="file"; f.accept="application/json";
  f.onchange = ()=>{
    const file = f.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = ()=>{ try{ S = JSON.parse(rd.result); save(); render(); }
      catch(e){ alert("That file isn't a Waterline backup."); } };
    rd.readAsText(file);
  };
  f.click();
}
function logFor(d){
  const k = todayKey();
  if(!S.history[k]) S.history[k] = {};
  if(!S.history[k][d.id]) S.history[k][d.id] = {};
  return S.history[k][d.id];
}
/* Attendance model: every scheduled training day (Mon/Tue/Wed/Fri/Sat) counts
   as trained unless you explicitly mark it missed — you only log the
   exceptions. Thursday and Sunday are off and don't count either way. */
const isWorkoutDow = (dow)=> dow!==0 && dow!==4;
function streak(){
  let n=0, dt=new Date();
  const since = S.since || todayKey();
  for(;;){
    if(isWorkoutDow(dt.getDay())){
      if(S.missed[dateKey(dt)]) break;
      n++;
    }
    if(dateKey(dt)<=since) break;
    dt.setDate(dt.getDate()-1);
  }
  return n;
}

/* This week's 5 training days (Mon/Tue/Wed/Fri/Sat), as Date objects. */
function weekWorkoutDates(){
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay()+6)%7));
  return Array.from({length:6},(_, i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return d; })
    .filter(d=>isWorkoutDow(d.getDay()));
}

/* ============================================================
   BODY WEIGHT — the only log meant to happen every time.
   Logged whenever you feel like it, not tied to a workout day.
   ============================================================ */
function renderBw(){
  const input = document.getElementById("bwInput"), trend = document.getElementById("bwTrend");
  input.value = S.bodyweight[todayKey()] || "";
  const dates = Object.keys(S.bodyweight).filter(k=>k!==todayKey() && S.bodyweight[k]).sort();
  if(!dates.length){ trend.textContent = "no entries yet"; return; }
  const lastDate = dates[dates.length-1], lastVal = parseFloat(S.bodyweight[lastDate]);
  const d = new Date(lastDate+"T00:00:00");
  const when = d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  const today = parseFloat(S.bodyweight[todayKey()]);
  if(!isNaN(today) && !isNaN(lastVal) && today!==lastVal){
    const diff = (today-lastVal).toFixed(1);
    trend.textContent = `${diff>0?"+":""}${diff} kg since ${when}`;
  } else {
    trend.textContent = `last ${lastVal} kg · ${when}`;
  }
}
document.getElementById("bwInput").oninput = (e)=>{
  S.bodyweight[todayKey()] = e.target.value;
  save(); renderBw();
};

/* ============================================================
   THIS WEEK — attendance strip. Every box defaults to "trained";
   tap a past or today box to mark it missed (tap again to undo).
   That's the only logging this feature asks for.
   ============================================================ */
const WK_LETTERS = ["M","T","W","F","S"];
function renderWeekStrip(){
  const el = document.getElementById("wkStrip");
  const todayK = todayKey();
  el.innerHTML = "";
  weekWorkoutDates().forEach((dt,i)=>{
    const k = dateKey(dt);
    const future = k > todayK;
    const missed = !!S.missed[k];
    const label = dt.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
    const btn = document.createElement("button");
    btn.className = "wdot"+(future?" future":missed?" missed":" on")+(k===todayK?" today":"");
    btn.textContent = WK_LETTERS[i];
    btn.disabled = future;
    btn.setAttribute("aria-label", future? `${label}: upcoming` : `${label}: ${missed?"marked missed":"trained"} — tap to toggle`);
    if(!future) btn.onclick = ()=>{
      if(S.missed[k]) delete S.missed[k]; else S.missed[k] = true;
      save(); renderWeekStrip(); renderHead();
    };
    el.appendChild(btn);
  });
}

/* ============================================================
   RENDER
   ============================================================ */
const view = document.getElementById("view");

function render(){
  renderRail(); renderHead(); renderBw(); renderWeekStrip();
  if(tab==="today") renderToday();
  else if(tab==="week") renderWeek();
  else renderGear();
}

function renderRail(){
  const r = document.getElementById("rail");
  r.innerHTML = "";
  PLAN.forEach(d=>{
    const b = document.createElement("button");
    b.className = "pill"+(d.id===sel.id?" on":"")+(d.blocks.length===0?" rec":"");
    b.textContent = d.tag.split(" · ")[0].replace("Day ","D")+" · "+d.name;
    b.onclick = ()=>{ sel=d; tab="today"; document.querySelectorAll("nav button")
      .forEach(x=>x.classList.toggle("on",x.dataset.tab==="today")); render(); };
    r.appendChild(b);
  });
}

function counts(d){
  const log = logFor(d); let tot=0, done=0;
  d.blocks.forEach((b,bi)=> b.items.forEach((it,ii)=>{
    tot += it.s;
    const a = log[exKey(d,bi,ii)]||[];
    done += a.filter(Boolean).length;
  }));
  return {tot,done};
}

function renderHead(){
  document.getElementById("dayTag").textContent = sel.tag;
  document.getElementById("dayName").textContent = sel.name;
  document.getElementById("daySub").textContent = sel.sub;
  const restDay = sel.blocks.length===0;
  const {tot,done} = counts(sel);
  const pct = tot? Math.round(done/tot*100):0;
  document.getElementById("mSets").textContent = restDay? "—" : done+"/"+tot;
  document.getElementById("mMins").textContent = restDay? "off" : sel.mins;
  document.getElementById("mPct").textContent = restDay? "rest" : pct+"%";
  document.getElementById("tide").style.height = restDay? "0%" : pct+"%";
  const st = streak();
  document.getElementById("streak").textContent = st? st+" day streak" : "start today";
}

function renderToday(){
  view.innerHTML = "";
  if(sel.blocks.length===0){
    const c = document.createElement("div");
    c.className = "callout";
    c.innerHTML = `<b>${sel.name} day</b>No workout scheduled — full rest. Recovery is when the fat-loss work actually shows up, so don't fill this with extra cardio. If you missed a session earlier this week, mark it in the "This week" strip up top.`;
    view.appendChild(c);
    return;
  }
  const log = logFor(sel);
  sel.blocks.forEach((b,bi)=>{
    const sec = document.createElement("section");
    sec.className = "block";
    sec.innerHTML = `<div class="block-hd"><h2>${b.label}</h2><span>~${b.mins} min</span></div>`;
    b.items.forEach((it,ii)=>{
      const k = exKey(sel,bi,ii);
      const arr = log[k] || (log[k] = new Array(it.s).fill(false));
      const el = document.createElement("div");
      el.className = "ex"+(arr.every(Boolean)?" done":"");
      const form = it.form ? FORMS[it.form] : null;
      el.innerHTML =
        `<div class="idx">${String(ii+1).padStart(2,"0")}</div>
         <div class="body">
           <div class="nm">${it.n}</div>
           <div><span class="gear">${it.g}</span>${form?`<button class="formBtn" type="button">&#9678; Form</button>`:""}<a class="yt" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(it.n+" proper form technique")}">&#9654; How to</a></div>
           <div class="prescribe"><b>${it.s}</b> × <b>${it.r}</b>${it.rest?` · rest ${it.rest}s`:""}</div>
           ${it.note?`<div class="note">${it.note}</div>`:""}
           ${form?`<div class="formPanel">${form.svg}<div class="cue">${form.cue}</div></div>`:""}
           <div class="row"><div class="dots"></div></div>
         </div>`;
      if(form){
        const btn = el.querySelector(".formBtn"), panel = el.querySelector(".formPanel");
        btn.onclick = ()=>{ panel.classList.toggle("show"); btn.classList.toggle("on"); };
      }
      const row = el.querySelector(".row"), dots = el.querySelector(".dots");
      for(let s=0;s<it.s;s++){
        const d = document.createElement("button");
        d.className = "dot"+(arr[s]?" on":"");
        d.textContent = s+1;
        d.setAttribute("aria-label",`Set ${s+1} of ${it.s}, ${it.n}`);
        d.onclick = ()=>{
          arr[s] = !arr[s];
          if(arr[s] && it.rest) startRest(it.rest);
          save(); renderToday(); renderHead();
        };
        dots.appendChild(d);
      }
      if(it.w){
        const w = document.createElement("input");
        w.className="wt"; w.type="text"; w.inputMode="decimal";
        w.placeholder="kg (optional)"; w.value = S.weights[k]||"";
        w.setAttribute("aria-label","Weight used for "+it.n);
        w.oninput = ()=>{ S.weights[k]=w.value; save(); };
        row.appendChild(w);
      }
      sec.appendChild(el);
    });
    view.appendChild(sec);
  });

  const c = document.createElement("div");
  c.className = "callout";
  c.innerHTML = `<b>Why the reps are high and the weight is light</b>This plan is built to lean you out, not bulk you up. Stay in the prescribed rep range and keep the weight light enough that the last 2–3 reps are genuinely hard — that's enough stimulus to shape without adding size. The fat loss itself happens in the kitchen, in a calorie deficit; the training just decides what shows up underneath.`;
  view.appendChild(c);
}

function renderWeek(){
  view.innerHTML = "";
  PLAN.forEach(d=>{
    const card = document.createElement("div");
    card.className = "wcard";
    const lifts = d.blocks.reduce((n,b)=>n+b.items.length,0);
    card.innerHTML =
      `<div class="t"><div class="nm">${d.name}</div><div class="dy">${d.tag.split(" · ")[1]}</div></div>
       <div class="sub">${d.sub}</div>
       <div class="prescribe">${lifts? `${lifts} exercises · ${d.mins} min` : "Full rest — no workout"}</div>`;
    card.onclick = ()=>{ sel=d; tab="today";
      document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.tab==="today"));
      render(); window.scrollTo({top:0,behavior:"smooth"}); };
    view.appendChild(card);
  });
  const c = document.createElement("div");
  c.className="callout";
  c.innerHTML = `<b>Every sixth week</b>Cut every set count in half and keep the same weights. You'll come back stronger than if you'd pushed through — that's the whole reason planned deloads exist.`;
  view.appendChild(c);
}

function renderGear(){
  view.innerHTML = "";
  GEAR.forEach(([title,items])=>{
    const s = document.createElement("div");
    s.className="gsec";
    s.innerHTML = `<h3>${title}</h3>`+items.map(([n,u])=>
      `<div class="gitem"><div>${n}</div><span>${u}</span></div>`).join("");
    view.appendChild(s);
  });
  const c = document.createElement("div");
  c.className="callout";
  c.innerHTML = `<b>Not in this gym</b>No hip thrust machine, no cable ankle strap, no barbell collars in the photos. Hip thrusts go on the flat bench with a barbell; for kickbacks, loop the cable handle around your ankle. Ask the trainer for collars before you squat heavy.`;
  view.appendChild(c);
}

/* ============================================================
   REST TIMER
   ============================================================ */
let rT=null, rLeft=0;
const rest = document.getElementById("rest"), rclock = document.getElementById("rclock");
function paint(){ rclock.textContent = Math.floor(rLeft/60)+":"+String(rLeft%60).padStart(2,"0"); }
function startRest(sec){
  rLeft = sec; paint(); rest.classList.add("up");
  clearInterval(rT);
  rT = setInterval(()=>{ rLeft--; paint(); if(rLeft<=0){ clearInterval(rT); rest.classList.remove("up"); } },1000);
}
document.getElementById("rAdd").onclick = ()=>{ rLeft+=30; paint(); };
document.getElementById("rSkip").onclick = ()=>{ clearInterval(rT); rest.classList.remove("up"); };

/* ============================================================
   TABS
   ============================================================ */
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); tab = b.dataset.tab; render();
  };
});

document.getElementById("bExp").onclick = exportData;
document.getElementById("bImp").onclick = importData;

load();
</script>
